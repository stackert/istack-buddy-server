# Redis Configuration for iStackBuddy Job Queue System
# Optimized for BullMQ background processing

# Network and Security
bind 127.0.0.1
port 6379
protected-mode yes
# requirepass your_redis_password_here  # Uncomment and set password for production

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence Configuration
# AOF (Append Only File) for data durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots for backup
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./

# Logging
loglevel notice
logfile ""
syslog-enabled no

# Performance Tuning
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Slow Log Configuration
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client Configuration
maxclients 10000

# Memory Optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Job Queue Specific Optimizations
# Disable some Redis features not needed for job queues
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Notify Keyspace Events (useful for job queue monitoring)
notify-keyspace-events "Ex"

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG ""

# Latency Monitoring
latency-monitor-threshold 100
